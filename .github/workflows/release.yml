name: Release

on:
  push:
    tags:
      - "v*"

# Each job asks for the permissions it needs.
permissions: {}

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

  # The same checks as for pushes to main, on the tagged commit.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      # Required to create the GitHub release.
      contents: write
      # Required for npm trusted publishing and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      # Node.js 24 ships npm 11, which supports trusted publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      # The ci job has already checked this commit, so prepublishOnly is
      # skipped and only the package is built.
      - run: bun run build

      - run: npm publish --ignore-scripts

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
