name: Release

on:
  push:
    tags:
      - "v*"

# Each job asks for the permissions it needs.
permissions: {}

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches the package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

  # The same checks as for pushes to main, on the tagged commit.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # The package is built without publishing permissions, so dependencies and
  # third-party actions never run in the job that can publish.
  build:
    name: Build the package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: npm pack --ignore-scripts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [version, ci, build]
    # The environment only allows v* tags, and npm only accepts trusted
    # publishing from this environment.
    environment:
      name: npm
      url: https://www.npmjs.com/package/svg-serde
    runs-on: ubuntu-latest
    permissions:
      # Required to create the GitHub release.
      contents: write
      # Required for npm trusted publishing and provenance.
      id-token: write
    steps:
      # Node.js 24 ships npm 11.19, which supports trusted publishing and,
      # since 11.15, staged publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      # The tarball from the build job is staged as is; no package scripts run
      # in the job that can publish. A staged version becomes installable only
      # after a maintainer approves it with 2FA on npmjs.com or with
      # `npm stage approve`. The trusted publisher cannot publish directly.
      - run: npm stage publish ./*.tgz --ignore-scripts

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
