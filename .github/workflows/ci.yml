name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks on the tagged commit before
  # publishing.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels the checks of the previous one. Other
# runs, such as pushes to main and releases, get a group of their own, so every
# commit there is checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type check, and build
    # A release commit only changes the version, and the release workflow
    # checks the same commit when its tag is pushed, so pushing it to main
    # skips these jobs.
    if: &not-release-commit >-
      !(github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'chore: release'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      # The build also validates the package with publint and attw.
      - run: bun run build

  node:
    name: Test on Node.js ${{ matrix.node }}
    if: *not-release-commit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported version, the active LTS, and the current release.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run test

  bun:
    name: Test on Bun ${{ matrix.bun }}
    if: *not-release-commit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The last 1.2 release, since Vitest needs APIs missing in earlier
        # ones, and the latest release.
        bun: ["1.2.23", latest]
    steps:
      - uses: actions/checkout@v7
      # Older Bun releases cannot read the lockfile written by the latest
      # one, so dependencies are installed with the latest release.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun --version
      - run: bun run test:bun

  browser:
    name: Test in browsers
    if: *not-release-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      # Browsers are cached per Playwright version. System libraries cannot be
      # cached and are installed on every run.
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium firefox webkit
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium firefox webkit
      - run: bun run test:browser
